# 宠物商店 - 中间件（MySQL + Redis）一键启动
# 启动： docker compose up -d
# 停止： docker compose down        （保留数据）
# 重置： docker compose down -v     （删库重来，会重新执行 sql/init.sql）
#
# 注意：MySQL 宿主机端口用 3307（容器内仍是 3306），避免和本机已装的 MySQL(3306) 冲突。
name: petshop

services:
  mysql:
    image: registry.cn-beijing.aliyuncs.com/itcast/mysql:8.0.29   # 用本地已有镜像，避免从 DockerHub 慢拉
    container_name: petshop-mysql
    restart: unless-stopped
    ports:
      - "3307:3306"            # 宿主机:容器  ->  本机用 3307 连接
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: petshop
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-authentication-plugin=mysql_native_password
      - --skip-name-resolve
    volumes:
      - petshop-mysql-data:/var/lib/mysql
      # 首次启动自动执行建表脚本
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: petshop-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - petshop-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: petshop-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"             # AMQP 协议端口（程序连这个）
      - "15672:15672"           # 管理界面 http://localhost:15672  账号 guest/guest
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      TZ: Asia/Shanghai
    volumes:
      - petshop-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.18   # 本地已有；与 SB2.7 的 Spring Data ES 匹配，勿用 8.x
    container_name: petshop-es
    restart: unless-stopped
    ports:
      - "9200:9200"               # REST 端口（程序连这个）
      - "9300:9300"               # 集群通信端口
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false      # 关闭鉴权，方便开发
      - ES_JAVA_OPTS=-Xms512m -Xmx512m    # 内存吃紧可调小
      - TZ=Asia/Shanghai
    volumes:
      - petshop-es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 40s

volumes:
  petshop-mysql-data:
  petshop-redis-data:
  petshop-rabbitmq-data:
  petshop-es-data:
