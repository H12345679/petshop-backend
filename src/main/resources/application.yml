server:
  port: 8080

spring:
  profiles:
    active: dev
  application:
    name: petshop-backend
  # 热启动/热部署：改完代码 Ctrl+F9（IDEA 重新编译）即自动重启
  devtools:
    restart:
      enabled: true
      poll-interval: 2s
      quiet-period: 1s
  mvc:
    pathmatch:
      # springfox + Spring Boot 2.7 必需，否则启动报 NPE
      matching-strategy: ant_path_matcher
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      write-dates-as-timestamps: false

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.petshop.**.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 配置（secret 必须 >= 32 字节）
jwt:
  secret: petshop-secret-key-please-change-in-prod-1234567890abcdef
  expire: 86400   # token 有效期（秒），默认 1 天

# Knife4j 接口文档
knife4j:
  enable: true
  setting:
    language: zh-CN

logging:
  level:
    com.petshop: debug
