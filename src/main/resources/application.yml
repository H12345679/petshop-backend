server:
  port: 8088

spring:
  profiles:
    # 想要使用局域网 IP (10.22.230.230) 数据库，请加上 lan，即 active: dev,lan,local
    # local 用于放本机私有配置（如七牛真实密钥），见 application-local.yml（已 gitignore，没有也能启动）
    active: dev,lan,local
  application:
    name: petshop-backend
  # 热启动/热部署：改完代码 Ctrl+F9（IDEA 重新编译）即自动重启
  devtools:
    restart:
      enabled: true
      poll-interval: 2s
      quiet-period: 1s
  mvc:
    pathmatch:
      # springfox + Spring Boot 2.7 必需，否则启动报 NPE
      matching-strategy: ant_path_matcher
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      write-dates-as-timestamps: false
  # 文件上传大小限制（视频已改为前端直传，此处恢复为安全的 10MB）
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# 七牛云对象存储（商品图片 + 视频，统一存储）。
# 下面是「占位默认值」：保证没有 application-local.yml 的人也能正常启动（只是上传会失败）。
# ⚠️ 真实 AccessKey/SecretKey/Bucket/域名 放在 application-local.yml（已 gitignore，不进仓库）里覆盖。
qiniu:
  access-key: your-access-key
  secret-key: your-secret-key
  bucket: your-bucket
  domain: http://your-domain

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.petshop.**.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 配置（secret 必须 >= 32 字节）
jwt:
  secret: petshop-secret-key-please-change-in-prod-1234567890abcdef
  expire: 86400   # token 有效期（秒），默认 1 天

# Knife4j 接口文档
knife4j:
  enable: true
  setting:
    language: zh-CN

logging:
  level:
    com.petshop: debug

amap:
  key: f2bb704018d6fb8aafa3d1bcb880b62d
  security-js-code: 77b5607769c0e45c2ad22c6b454220ca
