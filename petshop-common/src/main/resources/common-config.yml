# =====================================================================
# 各微服务共享的公共配置。
# 每个服务的 application.yml 通过以下方式引入：
#   spring:
#     config:
#       import:
#         - classpath:common-config.yml
#         - optional:classpath:local-config.yml   # 本机私钥（七牛/AI Key），已 gitignore
# 服务自己的 application.yml 只放：端口、服务名、该服务特有配置。
# 后续如需集中管理，可把本文件内容平移到 Nacos 配置中心（spring-cloud-starter-alibaba-nacos-config）。
# =====================================================================

spring:
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}

  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 共享库模式：所有服务连同一个 petshop 库（本地事务保住下单扣库存等关键链路）
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:petshop}?useUnicode=true&characterEncoding=utf8&serverTimezone=GMT%2B8&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      keep-alive: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2

  rabbitmq:
    host: ${MQ_HOST:localhost}
    port: 5672
    username: guest
    password: guest
    virtual-host: /

  elasticsearch:
    uris: ${ES_URIS:http://localhost:9200}
    connection-timeout: 5s

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      write-dates-as-timestamps: false

  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 8MB

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.petshop.**.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 配置（secret 必须 >= 32 字节；各服务共用同一密钥，网关透传 Authorization 头）
jwt:
  secret: petshop-secret-key-please-change-in-prod-1234567890abcdef
  expire: 86400   # token 有效期（秒），默认 1 天

# Knife4j 接口文档（各服务独立访问 http://localhost:<端口>/doc.html）
knife4j:
  enable: true
  setting:
    language: zh-CN

logging:
  level:
    com.petshop: debug

# 七牛云对象存储「占位默认值」，真实密钥放 local-config.yml（已 gitignore）
qiniu:
  access-key: your-access-key
  secret-key: your-secret-key
  bucket: your-bucket
  domain: http://your-domain

